name: exact-evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash tools/check_wheel.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: node --test --test-concurrency=1 tests/test_engine.mjs tests/test_browser.cjs tests/test_lumping_engine.mjs tests/test_lumping_browser.cjs tests/test_response_engine.mjs tests/test_response_browser.cjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
  external-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install sympy==1.14.0
      - run: python tools/check_sympy.py
      - run: python tools/check_lumping_sympy.py
      - run: python tools/check_response_sympy.py
